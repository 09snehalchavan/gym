<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pay Membership Fee</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <style>
        body {
            background: #eef3f8;
        }

        .payment-card {

            max-width: 700px;
            margin: auto;
            border: none;
            border-radius: 18px;
            box-shadow: 0 15px 30px rgba(0, 0, 0, .08);

        }

        .header {

            background: linear-gradient(135deg, #0d6efd, #6610f2);
            color: white;
            border-radius: 18px 18px 0 0;
            padding: 30px;

        }

        .pay-btn {

            width: 100%;
            height: 55px;
            font-size: 18px;
            border-radius: 12px;

        }

        .amount {

            font-size: 40px;
            font-weight: bold;
            color: #dc3545;

        }
    </style>

</head>

<body>

    <div class="container py-5">

        <div class="card payment-card">

            <div class="header text-center">

                <h2>

                    <i class="fa-solid fa-credit-card"></i>

                    Membership Payment

                </h2>

                <p class="mb-0">

                    Secure Online Payment

                </p>

            </div>

            <div class="card-body p-4">

                <div class="mb-4">

                    <label class="form-label fw-bold">

                        Membership Plan

                    </label>

                    <input type="text" class="form-control" value="{{ membership.plan_name }}" readonly>

                </div>

                <div class="mb-4">

                    <label class="form-label fw-bold">

                        Remaining Amount

                    </label>

                    <div class="amount">

                        ₹ {{ "%.0f"|format(remaining) }}

                    </div>

                </div>

                <div class="mb-4">

                    <label class="form-label fw-bold">

                        Payment Mode

                    </label>

                    <select class="form-select" name="payment_mode">

                        <option>UPI</option>

                        <option>Credit Card</option>

                        <option>Debit Card</option>

                        <option>Net Banking</option>

                    </select>

                </div>

                <form action="/member_pay_now" method="POST">

                    <input type="hidden" name="amount" value="{{ remaining }}">

                    <button class="btn btn-success pay-btn">

                        <i class="fa-solid fa-lock me-2"></i>

                        Pay ₹ {{ "%.0f"|format(remaining) }}

                    </button>

                </form>

                <br>

                <a href="/member_payment_history" class="btn btn-outline-secondary w-100">

                    Back

                </a>

            </div>

        </div>

    </div>

</body>

</html>
