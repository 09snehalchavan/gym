<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Member Login | Gym Management</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <link rel="stylesheet" href="{{ url_for('static', filename='css/member_login.css') }}">

</head>

<body>

    <div class="overlay">

        <div class="login-card">

            <div class="text-center mb-4">

                <div class="logo-circle">
                    <i class="fa-solid fa-dumbbell"></i>
                </div>

                <h2>Gym Management</h2>

                <p>Member Login Portal</p>

            </div>

            {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}

            {% for category,message in messages %}

            <div class="alert alert-{{category}}">
                {{message}}
            </div>

            {% endfor %}

            {% endif %}
            {% endwith %}

            <form method="POST">

                <div class="mb-3">

                    <label class="form-label">
                        Mobile Number
                    </label>

                    <div class="input-group">

                        <span class="input-group-text">

                            <i class="fa-solid fa-phone"></i>

                        </span>

                        <input type="text" name="mobile" class="form-control" placeholder="Enter Mobile Number"
                            required>

                    </div>

                </div>

                <div class="mb-4">

                    <label class="form-label">
                        Password
                    </label>

                    <div class="input-group">

                        <span class="input-group-text">

                            <i class="fa-solid fa-lock"></i>

                        </span>

                        <input type="password" id="password" name="password" class="form-control"
                            placeholder="Enter Password" required>

                        <button class="btn btn-light" type="button" onclick="togglePassword()">

                            <i class="fa-solid fa-eye" id="eye"></i>

                        </button>

                    </div>

                </div>

                <button class="btn login-btn w-100">

                    <i class="fa-solid fa-right-to-bracket"></i>

                    Login

                </button>

            </form>

            <div class="text-center mt-4">

                <small>

                    Default Password =
                    <strong>Date Of Birth (DDMMYYYY)</strong>

                </small>

            </div>

        </div>

    </div>

    <script src="{{ url_for('static', filename='js/member_login.js') }}"></script>

</body>

</html>
