<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Update Membership Plan</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

    <div class="container mt-5">

        <div class="card shadow">

            <div class="card-header bg-warning text-dark">
                <h3>Update Membership Plan</h3>
            </div>

            <div class="card-body">

                <form method="POST">

                    <div class="mb-3">

                        <label class="form-label">Plan Name</label>

                        <input type="text" name="plan_name" class="form-control" value="{{ plan.plan_name }}" required>

                    </div>

                    <div class="mb-3">

                        <label class="form-label">Duration (Days)</label>

                        <input type="number" name="duration" class="form-control" value="{{ plan.duration }}" required>

                    </div>

                    <div class="mb-3">

                        <label class="form-label">Price (₹)</label>

                        <input type="number" step="0.01" name="price" class="form-control" value="{{ plan.price }}"
                            required>

                    </div>

                    <button class="btn btn-success">
                        Update Plan
                    </button>

                    <a href="/view_plans" class="btn btn-secondary">
                        Back
                    </a>

                </form>

            </div>

        </div>

    </div>

</body>

</html>
