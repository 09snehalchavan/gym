<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Change Password</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <style>
        body {
            background: #f5f7fb;
        }

        .password-card {

            max-width: 550px;
            margin: auto;
            margin-top: 60px;

            border: none;
            border-radius: 18px;

            box-shadow: 0 10px 25px rgba(0, 0, 0, .08);

        }
    </style>

</head>

<body>

    <div class="container">

        {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
        {% for category, message in messages %}

        <div class="alert alert-{{ category }} alert-dismissible fade show mt-3">

            {{ message }}

            <button class="btn-close" data-bs-dismiss="alert"></button>

        </div>

        {% endfor %}
        {% endif %}
        {% endwith %}

        <div class="card password-card">

            <div class="card-header bg-dark text-white">

                <h3>

                    <i class="fa-solid fa-key"></i>

                    Change Password

                </h3>

            </div>

            <div class="card-body">

                <form method="POST">

                    <div class="mb-3">

                        <label class="form-label">

                            Current Password

                        </label>

                        <input type="password" name="current_password" id="current_password" class="form-control"
                            required>

                    </div>

                    <div class="mb-3">

                        <label class="form-label">

                            New Password

                        </label>

                        <input type="password" name="new_password" id="new_password" class="form-control" required>

                    </div>

                    <div class="mb-4">

                        <label class="form-label">

                            Confirm Password

                        </label>

                        <input type="password" name="confirm_password" id="confirm_password" class="form-control"
                            required>

                    </div>

                    <div class="form-check mb-4">

                        <input class="form-check-input" type="checkbox" onclick="showPassword()" id="show">

                        <label class="form-check-label">

                            Show Password

                        </label>

                    </div>

                    <div class="text-center">

                        <button class="btn btn-primary">

                            <i class="fa-solid fa-floppy-disk"></i>

                            Update Password

                        </button>

                        <a href="{{ url_for('member_profile') }}" class="btn btn-secondary">

                            <i class="fa-solid fa-arrow-left"></i>

                            Back

                        </a>

                    </div>

                </form>

            </div>

        </div>

    </div>

    <script>

        function showPassword() {

            let current = document.getElementById("current_password");
            let newpass = document.getElementById("new_password");
            let confirm = document.getElementById("confirm_password");

            if (current.type === "password") {

                current.type = "text";
                newpass.type = "text";
                confirm.type = "text";

            }

            else {

                current.type = "password";
                newpass.type = "password";
                confirm.type = "password";

            }

        }

    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
