<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Gym Management - Login</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body class="bg-light d-flex align-items-center justify-content-center vh-100">

    <div class="card shadow-lg border-0 rounded-4" style="width: 100%; max-width: 420px;">

        <div class="card-body p-5">

            <div class="text-center mb-4">
                <div class="mb-3">
                    <span style="font-size: 3rem;">🏋️</span>
                </div>

                <h2 class="fw-bold">Gym Management</h2>
                <p class="text-muted mb-0">Admin Login Panel</p>
            </div>

            {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
            {% for category, message in messages %}

            <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
                {{ message }}

                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            {% endfor %}
            {% endif %}
            {% endwith %}

            <form method="POST">

                <div class="mb-3">
                    <label class="form-label fw-semibold">Email Address</label>

                    <input type="email" name="email" class="form-control form-control-lg" placeholder="Enter your email"
                        required>
                </div>

                <div class="mb-4">
                    <label class="form-label fw-semibold">Password</label>

                    <div class="input-group">

                        <input type="password" name="password" id="password" class="form-control form-control-lg"
                            placeholder="Enter your password" required>

                        <button type="button" class="btn btn-outline-secondary" onclick="togglePassword()">
                            👁
                        </button>

                    </div>
                </div>

                <button type="submit" class="btn btn-primary btn-lg w-100">
                    Login
                </button>

            </form>

            <div class="text-center mt-4">
                <small class="text-muted">
                    &copy; 2026 Gym Management System
                </small>
            </div>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        function togglePassword() {

            const password = document.getElementById('password');

            if (password.type === 'password') {
                password.type = 'text';
            } else {
                password.type = 'password';
            }
        }
    </script>

</body>

</html>
