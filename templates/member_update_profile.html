<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Update Profile</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <style>
        body {
            background: #f5f7fb;
        }

        .profile-card {
            border: none;
            border-radius: 18px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, .08);
        }
    </style>

</head>

<body>

    <div class="container py-5">

        {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
        {% for category, message in messages %}

        <div class="alert alert-{{ category }} alert-dismissible fade show">

            {{ message }}

            <button class="btn-close" data-bs-dismiss="alert"></button>

        </div>

        {% endfor %}
        {% endif %}
        {% endwith %}

        <div class="card profile-card">

            <div class="card-header bg-dark text-white">

                <h3>

                    <i class="fa-solid fa-user-pen"></i>

                    Update Profile

                </h3>

            </div>

            <div class="card-body">

                <form method="POST">

                    <div class="row">

                        <div class="col-md-6 mb-3">

                            <label class="form-label">Full Name</label>

                            <input type="text" class="form-control" value="{{ member.full_name }}" readonly>

                        </div>

                        <div class="col-md-6 mb-3">

                            <label class="form-label">Gender</label>

                            <input type="text" class="form-control" value="{{ member.gender }}" readonly>

                        </div>

                    </div>

                    <div class="row">

                        <div class="col-md-6 mb-3">

                            <label class="form-label">Date of Birth</label>

                            <input type="text" class="form-control" value="{{ member.dob }}" readonly>

                        </div>

                        <div class="col-md-6 mb-3">

                            <label class="form-label">Mobile</label>

                            <input type="text" name="mobile" class="form-control" value="{{ member.mobile }}" required>

                        </div>

                    </div>

                    <div class="row">

                        <div class="col-md-6 mb-3">

                            <label class="form-label">Email</label>

                            <input type="email" name="email" class="form-control" value="{{ member.email }}" required>

                        </div>

                        <div class="col-md-3 mb-3">

                            <label class="form-label">Height (cm)</label>

                            <input type="number" name="height" class="form-control" value="{{ member.height }}">

                        </div>

                        <div class="col-md-3 mb-3">

                            <label class="form-label">Weight (kg)</label>

                            <input type="number" name="weight" class="form-control" value="{{ member.weight }}">

                        </div>

                    </div>

                    <div class="mb-3">

                        <label class="form-label">Address</label>

                        <textarea class="form-control" rows="3" name="address">{{ member.address }}</textarea>

                    </div>

                    <div class="text-center">

                        <button class="btn btn-primary">

                            <i class="fa-solid fa-floppy-disk"></i>

                            Update Profile

                        </button>

                        <a href="{{ url_for('member_profile') }}" class="btn btn-secondary">

                            <i class="fa-solid fa-arrow-left"></i>

                            Cancel

                        </a>

                    </div>

                </form>

            </div>

        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
